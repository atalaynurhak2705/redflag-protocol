group 'im.zoe.labs.flutter_notification_listener'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Namespace manuel olarak eklendi, hatayı önler
    namespace 'im.zoe.labs.flutter_notification_listener'
    compileSdkVersion 34

    buildFeatures {
        buildConfig = true
    }

    // --- KRİTİK DÜZELTME: JAVA 17'YE YÜKSELTİLDİ ---
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    // -----------------------------------------------

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    
    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // AndroidX Bağımlılıkları
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
}