group 'im.zoe.labs.flutter_notification_listener'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Kimlik Tanımı
    namespace 'im.zoe.labs.flutter_notification_listener'
    compileSdkVersion 34

    // BuildConfig Hatası İçin
    buildFeatures {
        buildConfig = true
    }

    // Java Sürüm Sabitleme
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    
    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    // --- GÜNCELLEME: Temel Bağımlılıklar Eklendi ---
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // AndroidX Startup ve Core (Crash hatasını çözen kısım)
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // MultiDex Desteği (Kapasite sorunu için)
    implementation 'androidx.multidex:multidex:2.0.1'
}