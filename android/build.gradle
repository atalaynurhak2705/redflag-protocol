buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// --- GLOBAL YAMA (ZAMANLAMA HATASI DÜZELTİLDİ) ---
subprojects {
    // Yapılacak ayarları bir değişkene (fonksiyona) atıyoruz
    def configureApp = {
        if (project.hasProperty('android')) {
            project.android {
                // 1. BuildConfig Hatası İçin
                buildFeatures {
                    buildConfig = true
                }

                // 2. Namespace Hatası İçin (Otomatik Tamamlama)
                if (namespace == null) {
                    namespace project.group.toString()
                }

                // 3. Java Sürüm Çakışması İçin
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
            }
            
            // 4. Kotlin Sürüm Çakışması İçin
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }
        }
    }

    // KRİTİK KONTROL: Proje zaten hazırlandı mı?
    if (project.state.executed) {
        // Evet, geç kaldık -> HEMEN UYGULA
        configureApp()
    } else {
        // Hayır, zaman var -> SIRAYA KOY
        project.afterEvaluate {
            configureApp()
        }
    }
}
// -------------------------------------------------

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}