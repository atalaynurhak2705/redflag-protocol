buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// --- V4 ULTRA SAFE GLOBAL CONFIGURATION ---
subprojects {
    // Ayarları bir blok içine alıyoruz ki duruma göre çağırabilelim
    def configureProjectSettings = {
        // 1. Android Ayarları (Sadece Android projeleri için)
        if (project.hasProperty('android')) {
            project.android {
                // Namespace eksikse tamamla
                if (namespace == null) {
                    namespace project.group.toString()
                }
                // BuildConfig özelliğini aç (cloud_firestore için şart)
                buildFeatures {
                    buildConfig = true
                }
                // Java 17 Standartı
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        
        // 2. Kotlin Ayarları (Evrensel - Android bloğunun dışında olmalı)
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }

    // --- ZAMANLAMA KONTROLÜ (CRASH FIX) ---
    if (project.state.executed) {
        // Proje zaten değerlendirildiyse, bekleme yapma HEMEN uygula
        configureProjectSettings()
    } else {
        // Henüz bitmediyse, bittiğinde uygula
        project.afterEvaluate {
            configureProjectSettings()
        }
    }
}
// ------------------------------------------

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}